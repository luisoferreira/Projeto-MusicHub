<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">

    <title>MusicHub</title>


    <link rel="stylesheet" href="Home.css">

    <link rel="shortcut icon" href="../Assets/Logo MusicHub reduzida.svg" type="image/x-icon">

                <article class="card-musica">

                    <a href="../telaLetras/index.html" class="card-musica__link">

                            <img src="../telaLetras/assets/album1.jpg" alt="Capa de Hotline Bling">

                        <h3>Hotline Bling</h3>
