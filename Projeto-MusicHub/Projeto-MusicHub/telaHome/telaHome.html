<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MusicHub</title>


    <link rel="stylesheet" href="telaHome.css">
    <script src="../telaHome/telaHome.js"></script>
</head>

<body>

   <!-- topo/cabeçalho -->
    <header class="topo">

        <div class="logo">
           <img src="../Assets/Logo horizontal.svg" alt="">
        </div>

        <nav class="navegacao">
            <img src="../Assets/Busca.svg" alt="buscar">
            <a href="#">Buscar</a>
            <img src="../Assets/Icone biblioteca.svg" alt="">
            <a href="#">Biblioteca</a>
            <img src="../Assets/Icone perfil.svg" alt="">
           
            <img src="../Assets/Icone configuracoes.svg" alt="">
        </nav>

    </header>


    <!-- Menu lateral -->
    <aside class="menu-lateral">

        <div class="navegacao">
            <nav>
                <img src="../Assets/Icone perfil.svg" alt="perfil">
                <img src="../Assets/Icone biblioteca.svg" alt="">
                <img src="../Assets/Icone musicas curtidas.svg" alt="">
                
                <img src="../Assets/Início.svg" alt="">
            </nav>
        </div>
    
       

    </aside>


    <!-- CONTEÚDO PRINCIPAL -->
    <main class="conteudo">

       
    <!-- carrosel tela inicial -->
     <div class="carrossel">
        
        <div class="carrosel-imagens">
            <img src="../Assets/carrossel foto 1.svg" alt="travis Scott">
            <img src="../Assets/carrossel foto 2.svg" alt="joao gomes" >
            <img src="../Assets/carrossel foto 3.svg" alt="henrique e juliano">
            <img src="../Assets/carrossel foto 4.svg" alt="coldplay">
        </div>
     </div>



        <!-- MÚSICAS -->
        <section class="musicas">

            <h2>Músicas mais escutadas</h2>

            <div class="lista-musicas">

                <!-- CARD 1 -->
                <article class="card-musica">

                    <div class="imagem-musica">
                        <img src="../Assets/hotling bling.svg" alt="">
                    </div>

                    <h3>Hotline Bling</h3>
                    <p>Drake</p>

                    <button>▶</button>

                </article>


                <!-- CARD 2 -->
                <article class="card-musica">

                    <div class="imagem-musica">
                      <img src="../Assets/michael jackson.svg" alt="">
                    </div>

                    <h3>Billie Jean</h3>
                    <p>Michael Jackson</p>

                    <button>▶</button>

                </article>


                <!-- CARD 3 -->
                <article class="card-musica">

                    <div class="imagem-musica">
                        <img src="../Assets/noite fria.svg" alt="">
                    </div>

                    <h3>Noite Fria</h3>
                    <p>MC IG</p>

                    <button>▶</button>

                </article>


                <!-- CARD 4 -->
                <article class="card-musica">

                    <div class="imagem-musica">
                        <img src="../Assets/cherry waves.svg" alt="">
                    </div>

                    <h3>Cherry Waves</h3>
                    <p>Deftones</p>

                    <button>▶</button>

                </article>


                <!-- CARD 5 -->
                <article class="card-musica">

                    <div class="imagem-musica">
                       <img src="../Assets/see you again.svg" alt="">
                    </div>

                    <h3>See You Again</h3>
                    <p>Tyler, The Creator</p>

                    <button>▶</button>

                </article>

            </div>

        </section>

    </main>

</body>

</html>
