<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MusicHub - Notificações</title>
    <link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../Notificacao/notificacao.css">
</head>

<body>

    <header class="cabecalho">
        <img class="logo" src="../Assets/Logo horizontal.svg" alt="MusicHub">

        <div class="cabecalho__acoes">
            <button class="botao-busca"><img src="../Assets/Busca.svg" alt="">Buscar</button>
            <span class="divisor"></span>
            <a class="link-biblioteca" href="#"><img src="../Assets/Icone biblioteca.svg" alt="">Biblioteca</a>
            <span class="divisor"></span>
            <img class="avatar" src="../Assets/Icone perfil.svg" alt="Perfil">
            <img class="icone-configuracoes" src="../Assets/Icone configuracoes.svg" alt="Configurações">
        </div>
    </header>

    <aside class="barra-lateral">
        <button class="seta" aria-label="Expandir menu"></button>
        <img src="../Assets/Icone perfil.svg" alt="Perfil">
        <img src="../Assets/Icone biblioteca.svg" alt="Biblioteca">
        <img src="../Assets/Icone musicas curtidas.svg" alt="Músicas curtidas">
        <img class="inicio" src="../Assets/Início.svg" alt="Início">
    </aside>

    <main class="principal">
        <section class="painel">
            <div class="painel__topo">
                <button class="botao-limpar">Limpar</button>
                <h1 class="painel__titulo">Notificações</h1>
            </div>

            <img class="aviao" src="../Assets/Icone notificações.svg" alt="">
            <p class="painel__texto">Você não tem notificações no momento.</p>
        </section>
    </main>

</body>

</html>
