<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MusicHub - Perfil</title>
    <link rel="stylesheet" href="Perfil.css">
    <link rel="stylesheet" href="../Styles/global.css">
    <link rel="shortcut icon" href="../Assets/Logo MusicHub reduzida.svg" type="image/x-icon">
</head>

<body>
    <div class="tela">

        <div class="estrutura">
            <main class="conteudo-principal">
                <section class="perfil">
                    <div class="perfil__identidade">
                        <span class="avatar avatar--grande"></span>
                        <div class="perfil__nomes">
                            <h1 class="perfil__nome">SeuNome</h1>
                            <p class="perfil__usuario">@SeuArroba</p>
                        </div>
                    </div>

                    <ul class="perfil__estatisticas">
                        <li>Seguindo: 6</li>
                        <li>Curtidas: 8</li>
                        <li>Favoritas: 6</li>
                    </ul>

                    <div class="perfil__descricao">
                        <h2 class="perfil__descricao-titulo">Sua descrição</h2>
                    </div>
                </section>

                <section class="playlists">
                    <h2 class="playlists__titulo">Playlists</h2>
                    <ul class="playlists__lista">
                        <li class="playlist">
                            <a href="#" class="playlist__link">
                                <span class="playlist__capa playlist__capa--funk"><b>FUNK</b></span>
                                <span class="playlist__nome">Funk de cria</span>
                            </a>
                        </li>
                        <li class="playlist">
                            <a href="#" class="playlist__link">
                                <span class="playlist__capa playlist__capa--pagode"></span>
                                <span class="playlist__nome">Pagodinho na Praia</span>
                            </a>
                        </li>
                        <li class="playlist">
                            <a href="../playlist/playlist.html" class="playlist__link">
                                <span class="playlist__capa playlist__capa--academia"></span>
                                <span class="playlist__nome">Academia</span>
                            </a>
                        </li>
                        <li class="playlist">
                            <a href="#" class="playlist__link">
                                <span class="playlist__capa playlist__capa--estudos"></span>
                                <span class="playlist__nome">Estudos</span>
                            </a>
                        </li>
                    </ul>
                </section>
            </main>
        </div>

    </div>
    <script src="../Styles/global.js"></script>
</body>

</html>
