<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login MusicHub</title>

    <link rel="stylesheet" href="../telaLogin/telaLogin.css">
    <link rel="shortcut icon" href="../Assets/Logo MusicHub reduzida.svg" type="image/x-icon">
</head>

<body>

    <div class="tela-login">

        <div class="login">

            <img src="../Assets/Logo vertical.svg" alt="logo musichub">


            <form>
                <div class="campos">

                    <div class="email">
                        <label for="email">E-mail</label>
                        <input type="email" id="email" placeholder="Digite seu e-mail">
                    </div>

                    <div class="senha">
                        <label for="senha">Senha</label>
                        <input type="password" id="senha" placeholder="Digite sua senha">
                    </div>

                    <button type="submit" class="botao-entrar">
                        Entrar
                    </button>

                    <div class="google">
                        <button type="button" class="botao-google">
                            <span class="google">
                                <img src="../Assets/Logo google.svg" alt="">
                            </span>
                            Continuar com o google
                        </button>
                    </div>

                    <div class="esqueceuSenha">
                        Esqueceu a senha?

                        <a href="../Home/Home.html" class="voltar">
                            Voltar
                            <!-- Código de voltar/logout temporário. Somente para fins de teste - ass: Leo -->
                        </a>
                    </div>


                </div>
            </form>
        </div>


    </div>

</body>

</html>
